name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    # 04:15 UTC = 09:45 IST, every day
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update today's rates (scheduled / manual runs only)
        if: github.event_name != 'push'
        env:
          RATE_API_URL: ${{ secrets.RATE_API_URL }}
          RATE_API_KEY: ${{ secrets.RATE_API_KEY }}
          RATE_SOURCE_NAME: ${{ secrets.RATE_SOURCE_NAME }}
          RATE_SOURCE_URL: ${{ secrets.RATE_SOURCE_URL }}
        run: node scripts/update-rates.mjs

      - name: Commit updated rates
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet data/rates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rates.json
            git commit -m "Update silver rates"
            git push
          fi

      - name: Build site
        run: node scripts/build.mjs

      - name: Check site
        run: node scripts/check.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
