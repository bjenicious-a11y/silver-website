name: Update silver rates

# Fetches today's rate (if RATE_API_URL secret is set) and commits data/rates.json.
# Cloudflare rebuilds and redeploys the site automatically on every push to main.
on:
  schedule:
    # 04:15 UTC = 09:45 IST, every day
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch today's rates
        env:
          RATE_API_URL: ${{ secrets.RATE_API_URL }}
          RATE_API_KEY: ${{ secrets.RATE_API_KEY }}
          RATE_SOURCE_NAME: ${{ secrets.RATE_SOURCE_NAME }}
          RATE_SOURCE_URL: ${{ secrets.RATE_SOURCE_URL }}
        run: node scripts/update-rates.mjs

      - name: Check the site still builds
        run: node scripts/build.mjs && node scripts/check.mjs

      - name: Commit updated rates
        run: |
          if ! git diff --quiet data/rates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rates.json
            git commit -m "Update silver rates"
            git push
          fi
