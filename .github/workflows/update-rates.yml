name: Update silver rates

# Fetches today's silver price from MetalCharts and commits data/rates.json to main.
# Cloudflare rebuilds and redeploys the site automatically on every push to main.
# The first run (while data/rates.json still holds sample data) also backfills ~30 days.
on:
  schedule:
    # 04:15 UTC = 09:45 IST, every day
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Replace history with the last ~30 days'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch silver rates
        env:
          METALCHARTS_API_KEY: ${{ secrets.METALCHARTS_API_KEY }}
        run: node scripts/update-rates.mjs ${{ inputs.backfill && '--backfill' || '' }}

      - name: Check the site still builds
        run: node scripts/build.mjs && node scripts/check.mjs

      - name: Commit updated rates
        run: |
          if ! git diff --quiet data/rates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rates.json
            git commit -m "Update silver rates"
            git push origin HEAD:main
          fi
